# nats-server — "open" instance on jia: tailnet-reachable, no auth.
# Anyone on the tailnet can publish/subscribe/administer JetStream, so
# keep disposable data here; use nats.secure.conf for anything else.
#
# $NATS_STORE is exported by run.sh (the XDG state dir for this instance).

server_name: jia-nats-open

# Bind the tailnet address only — jia is also on the LAN.
host: 100.80.150.96
port: 4222
http: 100.80.150.96:8222

logtime: true
debug: false
trace: false

jetstream {
    store_dir: $NATS_STORE
    max_memory_store: 1GB
    max_file_store: 10GB
}

max_payload: 8MB
max_connections: 200

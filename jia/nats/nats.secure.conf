# nats-server — "secure" instance on jia: tailnet-reachable, nkey auth.
# Clients authenticate by signing the server nonce with an nkey seed;
# only public keys live here (nkeys.conf, written by nkeys.sh). Seeds
# stay in the git-ignored nkeys/ dir.
#
# $NATS_STORE is exported by run.sh (the XDG state dir for this instance).

server_name: jia-nats-secure

# Bind the tailnet address only — jia is also on the LAN.
host: 100.80.150.96
port: 4223
http: 100.80.150.96:8223

logtime: true
debug: false
trace: false

jetstream {
    store_dir: $NATS_STORE
    max_memory_store: 1GB
    max_file_store: 10GB
}

max_payload: 8MB
max_connections: 200

# Defines the `authorization { users: [...] }` block. Per-user
# permissions go there.
include "nkeys.conf"
